# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve`. If you change this file, please restart the server process.

# Site Settings
locale                   : "en-US"
title                    : "Jaylen Wang"
title_separator          : "-"
name                     : &name "Jaylen Wang"
description              : &description "personal description"
url                      : https://jaylenwang.com # the base hostname & protocol for your site e.g. "https://mmistakes.github.io"
baseurl                  : "" # the subpath of your site, e.g. "/blog"
# The GitHub repo name, not the site URL - these stopped matching when the site
# moved to a custom domain. It stays `jaylenwang7.github.io` because that is
# what jekyll-github-metadata resolves against, and because GitHub Pages serves
# the 301s from the old URLs only while the repo keeps that name.
repository               : "jaylenwang7.github.io"
teaser                   :  # filename of teaser fallback teaser image placed in /images/, .e.g. "500x300.png"
breadcrumbs              : false # true, false (default)
words_per_minute         : 160
future                   : true
read_more                : "disabled" # if enabled, adds "Read more" links to excerpts
talkmap_link             : false #change to true to add link to talkmap on talks page
comments:
  provider               : # false (default), "disqus", "discourse", "facebook", "google-plus", "staticman", "custom"
  disqus:
    shortname            :
  discourse:
    server               : # https://meta.discourse.org/t/embedding-discourse-comments-via-javascript/31963 , e.g.: meta.discourse.org
  facebook:
    appid                :
    num_posts            : # 5 (default)
    colorscheme          : "dark"
staticman:
  allowedFields          : ['name', 'email', 'url', 'message']
  branch                 : "gh-pages" # "master", "gh-pages"
  commitMessage          : "New comment."
  filename               : comment-{@timestamp}
  format                 : "yml"
  moderation             : true
  path                   : "_data/comments/{options.slug}"
  requiredFields         : ['name', 'email', 'message']
  transforms:
    email                : "md5"
  generatedFields:
    date:
      type               : "date"
      options:
        format           : "iso8601" # "iso8601" (default), "timestamp-seconds", "timestamp-milliseconds"
atom_feed:
  path                   : # blank (default) uses feed.xml

# SEO Related
google_site_verification :
bing_site_verification   :
alexa_site_verification  :
yandex_site_verification :

# Social Sharing
twitter:
  username               : &twitter
facebook:
  username               :
  app_id                 :
  publisher              :
og_image                 :  # Open Graph/Twitter default site image
# For specifying social profiles
# - https://developers.google.com/structured-data/customize/social-profiles
social:
  type                   : # Person or Organization (defaults to Person)
  name                   : # If the user or organization name differs from the site's name
  links: # An array of links to social media profiles


# Analytics
analytics:
  provider               :  "google-universal" # false (default), "google", "google-universal", "custom"
  google:
    tracking_id          :


# Site Author
author:
  name             : "Jaylen Wang"
  avatar           : "profile2.jpg"
  # Cross-faded in on hover over the portrait. Cropped from the same shoot so
  # the head lands at the same size and position and the two register; if you
  # swap either image, re-match the framing or the swap reads as a jump cut.
  # Optional: leave it blank and the portrait simply stops reacting.
  avatar_hover     : "profile2-goofy.jpg"
  bio              : "PhD Candidate @CMU ECE"
  location         : "Pittsburgh, PA"
  employer         :
  pubmed           :
  googlescholar    : "https://scholar.google.com/citations?user=XZeSn5wAAAAJ&hl=en"
  email            : "jaylenw@andrew.cmu.edu"
  researchgate     :  # example: "https://www.researchgate.net/profile/yourprofile"
  uri              :
  bitbucket        :
  codepen          :
  dribbble         :
  flickr           :
  facebook         :
  foursquare       :
  github           : "jaylenwang7"
  google_plus      :
  keybase          :
  instagram        :
  impactstory      : #"https://profiles.impactstory.org/u/xxxx-xxxx-xxxx-xxxx"
  lastfm           :
  linkedin         : "jaylen-wang"
  orcid            : "https://orcid.org/0000-0001-6868-7169"
  pinterest        :
  soundcloud       :
  stackoverflow    : # http://stackoverflow.com/users/123456/username
  steam            :
  tumblr           :
  twitter          : "wang_jaylen"
  vine             :
  weibo            :
  xing             :
  youtube          :
  wikipedia        :


# Reading Files
include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - CHANGELOG
  - CLAUDE.md
  - CONTRIBUTING.md
  - Capfile
  - Gemfile
  - Gruntfile.js
  - LICENSE
  # Was `README`, which matches nothing: Jekyll excludes by path, so the
  # extension is required. Without it the file was served at /README.md.
  - README.md
  - Rakefile
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - config
  - gulpfile.js
  - log
  - node_modules
  - package.json
  - tmp
  - vendor

  # Build tooling, not a page. These are the scripts that turn a .bib or .tsv
  # into the markdown under _publications - they were being served, so
  # /markdown_generator/ was a public URL listing .py and .ipynb files.
  - markdown_generator

  # AcademicPages template scaffolding. Left here rather than deleted, since
  # they are worth reading if a page ever needs rebuilding, but they are not
  # this site and were all live, orphaned URLs in sitemap.xml - nothing on the
  # site has ever linked to one.
  #
  # Demonstrations of the theme's layouts:
  - _pages/archive-layout-with-content.md
  - _pages/non-menu-page.md
  - _pages/collection-archive.html
  - _pages/page-archive.html
  #
  # Archives over `site.posts`, which the writing index now owns. Left in they
  # would come back the day the blog launches as three more listings of the
  # same entries, competing with /writing/ and each other:
  - _pages/year-archive.html
  - _pages/category-archive.html
  - _pages/tag-archive.html
  #
  # An HTML index of every page and collection, which is what made the above
  # reachable. sitemap.xml is the version that has a consumer:
  - _pages/sitemap.md
  #
  # Empty collection, so the page rendered a heading and nothing else:
  - _pages/portfolio.html
  #
  # _talks holds four unedited placeholders ("Talk 1 on Relevant Topic in Your
  # Field", venue "Department of Testing"), and talkmap plots them on a Leaflet
  # map it vendors its own copy of. Restore all three together once there are
  # real talks to list; see the `talks` collection note below.
  - _pages/talks.html
  - _pages/talkmap.html
  - talkmap

  # Retired pages. Not template scaffolding - these were real, but nothing has
  # linked to any of them for a while, so each was a page only a search engine
  # could find. Source kept for the same reason as above.
  #
  # The template's privacy policy, `modified: 2016-06-06`, describing ad
  # networks and cookie behaviour this site does not have. A privacy policy
  # that is wrong about the site is worse than no page at all:
  - _pages/terms.md
  #
  # /publications/ and /teaching/ carry the record now. See the `research`
  # collection note below - the page and the collection go together, or the
  # three entries under _research stay live at /research/<name> without an
  # index pointing at them.
  - _pages/research.md
  - _pages/courses.md
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false


# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false


# Collections
collections:
  # Teaching is no longer a collection: it lives in _data/teaching.yml and
  # renders in full on /teaching/, so there is nothing left for a per-course
  # page to add.
  research:
    # Retired with _pages/research.md. `output: true` here is what generated
    # /research/DNN_resilience and its two siblings; excluding only the index
    # page would have orphaned them rather than removed them.
    output: false
    permalink: /:collection/:path/
  publications:
    # No per-paper pages. They only repeated what the entry on /publications/
    # already shows, so the title there is plain text rather than a link to a
    # thinner version of itself.
    output: false
    permalink: /:collection/:path/
  portfolio:
    # Nothing in _portfolio, so `output: true` only ever produced an empty
    # listing at /portfolio/. Flip back on when there is something to list.
    output: false
    permalink: /:collection/:path/
  talks:
    # The four entries in _talks are the template's placeholders, and each was
    # its own indexable page. Turned off rather than emptied so real talks can
    # be added later; also un-exclude _pages/talks.html and talkmap above.
    output: false
    permalink: /:collection/:path/


# Defaults
defaults:
  # _posts - writing entries. See _layouts/writing.html for the front matter
  # an entry can set, and _data/writing.yml for the strand vocabulary.
  #
  # `_posts` rather than a collection on purpose: drafts (`_drafts/`, shown
  # with `jekyll serve --drafts`), the RSS feed jekyll-feed builds from
  # `site.posts`, and the date-in-filename convention all come free, and none
  # of them do for a collection.
  - scope:
      path: ""
      type: posts
    values:
      layout: writing
      # The entry owns the full width; the profile rail belongs on the pages
      # that are about the person rather than about the argument.
      author_profile: false
      # Overrides the site-wide `/:categories/:title/`. Entries are classified
      # by `strand:`, not by Jekyll categories, so there are no categories to
      # put in the path - and the year keeps slugs from ever colliding.
      permalink: /writing/:year/:slug/
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  # _publications
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
  # _research
  - scope:
      path: ""
      type: research
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
  # _portfolio
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true
      share: true
      comment: true
  # _talks
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      share: true

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed # http://sass-lang.com/documentation/file.SASS_REFERENCE.html#output_style


# Outputting
permalink: /:categories/:title/
# paginate: 5 # amount of posts to show
# paginate_path: /page:num/
timezone: America/Los_Angeles # http://en.wikipedia.org/wiki/List_of_tz_database_time_zones


# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-redirect-from
# mimic GitHub Pages with --safe
whitelist:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji


# Archives
#  Type
#  - GitHub Pages compatible archive pages built with Liquid ~> type: liquid (default)
#  - Jekyll Archives plugin archive pages ~> type: jekyll-archives
#  Path (examples)
#  - Archive page should exist at path when using Liquid method or you can
#    expect broken links (especially with breadcrumbs enabled)
#  - <base_path>/tags/my-awesome-tag/index.html ~> path: /tags/
#  - <base_path/categories/my-awesome-category/index.html ~> path: /categories/
#  - <base_path/my-awesome-category/index.html ~> path: /
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
# https://github.com/jekyll/jekyll-archives
# jekyll-archives:
#   enabled:
#     - categories
#     - tags
#   layouts:
#     category: archive-taxonomy
#     tag: archive-taxonomy
#   permalinks:
#     category: /categories/:name/
#     tag: /tags/:name/


# HTML Compression
# - http://jch.penibelst.de/
compress_html:
  clippings: all
  ignore:
    envs: development
